# === Waitlist / Ticket System ===
ticket_distribution_mode: "arrival"   # "arrival" | "random_time" | "waves"
ticket_assignment: "sequential"       # "sequential" | "random"

# === Four independent limit axes (default OFF) ===
per_sku_qty_limit_enabled: false
per_sku_qty_limit: 3

total_qty_limit_enabled: false
total_qty_limit: 10

spend_cap_enabled: false
spend_cap_dollars: 270

# Escalating cooldown between turns (decoupled from caps now)
cooldown_enabled: false
timeout_increment_minutes: 10

# === Parent-Child 2x Authority (always on) ===
parent_child_authority: true

# === Scalper Behavior ===
# scalper resale markup, sampled uniform over [min, max] of MSRP
scalper_markup_min: 0.40   # 1.4x MSRP
scalper_markup_max: 1.50   # 2.5x MSRP
scalper_transaction_cost: 8   # $ flat cost to flip (shipping, fees, time)

# === Alternative Store Baseline (Naples comparison) ===
alt_store_acquisition_rate: 16

# === Store Hours ===
store_open_hour: 9
store_close_hour: 16
ticket_window_start: 1
ticket_window_end: 9

# === Line entry ===
# One collector and one scalper attempt per interval, until store closing.
lineup_start_hour: 1
lineup_interval_minutes: 10
lineup_reference_sku: ETB
# WTP ~ Normal(MSRP + mean offset, standard deviation).
# Join probability = sigmoid(intercept + slope * (WTP - MSRP)).
# Negative slopes make positive residuals less likely to join.
collector_lineup:
  wtp_mean_offset_dollars: 0
  wtp_std_dollars: 10
  logit_intercept: 0
  logit_slope_per_dollar: -0.15
scalper_lineup:
  wtp_mean_offset_dollars: 0
  wtp_std_dollars: 15
  logit_intercept: -1
  logit_slope_per_dollar: -0.25

# === Consumer Types (partner tunes these) ===
consumer_type_weights: {hardcore: 0.20, enthusiast: 0.50, budget: 0.30}
consumer_budgets:
  hardcore: 600
  enthusiast: 210
  budget: 60
# priority = order of spending preference (first item is what they want most)
consumer_priorities:
  hardcore:   [UPC, ETB, Bundle, Tin, Single]
  enthusiast: [ETB, Bundle, UPC, Tin, Single]
  budget:     [Bundle, ETB, Tin, Single, UPC]
# scalpers share the hardcore priority vector
scalper_priority: [UPC, ETB, Bundle, Tin, Single]

# === SKU MSRP (also the simulated checkout price) ===
sku_prices:
  ETB: 59.99
  Tin: 9.99
  Bundle: 29.99
  UPC: 179.99
  Single: 4.99

# === SKU Supply (mean units at 20,000 and 9,000,000 people) ===
sku_supply:
  ETB: [60, 80]
  Tin: [30, 40]
  Bundle: [40, 60]
  UPC: [30, 50]
  Single: [120, 150]
city_population: 4510000

# === Purchase Interaction Time ===
interaction_time_min: 1

# per-SKU max the scalper believes they can resell before $/hr collapses
# (dealer-scale, not consumer-scale). This is the "couldn't unload N-20" idea,
# per SKU. Calibrate from how much actually moves per SKU on the flip market.
scalper_sell_through:
  ETB: 100
  Tin: 100
  Bundle: 100
  UPC: 100
  Single: 100
# === Collusion: networked scalpers inherit the earliest member's queue timing ===
collusion_enabled: true
# Network membership probabilities at the same population endpoints.
scalper_network_prob: [0.05, 0.75]

# how aggressively each scalper attacks each SKU, as a fraction of that SKU's
# sell-through ceiling, drawn per scalper (gives variance without flat qcap)
scalper_demand_share: [0.80, 1.00]
# personal credit limit (the $ cap that binds independently of store cap)
scalper_credit_min: 10000
scalper_credit_max: 10000
# behavior mix (baseline = all A; we'll sweep B/C later)
scalper_behavior_weights: {A: 1.0, B: 0.0, C: 0.0}
